<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GeFit Plataforma — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --gefit-dark:#0D0E0F; --gefit-charcoal:#1A1C1E; --gefit-blue:#003B8E; --gefit-blue-mid:#0A4FAA;
    --gefit-green:#B3F400; --gefit-metal:#4E545C; --gefit-bg:#F2F4F7; --border:#E3E7ED; --red:#C4432B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Barlow', sans-serif; background:var(--gefit-bg); color:var(--gefit-dark);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .box{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:40px 36px; width:100%; max-width:380px; }
  .box img{ width:150px; display:block; margin:0 auto 28px; }
  h1{ font-family:'Barlow Condensed'; font-size:24px; text-align:center; margin-bottom:4px; }
  .sub{ text-align:center; color:var(--gefit-metal); font-size:13px; margin-bottom:26px; }
  label{ font-size:12.5px; font-weight:600; color:var(--gefit-metal); display:block; margin-bottom:6px; }
  input{
    width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:8px;
    font-family:'Barlow'; font-size:14px; margin-bottom:16px;
  }
  input:focus{ outline:none; border-color:var(--gefit-blue); }
  button{
    width:100%; background:var(--gefit-blue); color:#fff; border:none; border-radius:8px;
    padding:13px; font-family:'Barlow Condensed'; font-size:16px; font-weight:700; cursor:pointer;
  }
  button:hover{ background:var(--gefit-blue-mid); }
  .error{ background:#FDECEA; color:var(--red); font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; display:none; }
  .foot{ text-align:center; font-size:11px; color:var(--gefit-metal); margin-top:24px; }
</style>
</head>

    <h1>Desafio ROI 21 Dias</h1>
    <div class="sub">Academia Modelo GeFit</div>
    <div class="error" id="errorMsg"></div>
    <form id="loginForm">
      <label>E-mail</label>
      <input type="email" id="email" required>
      <label>Senha</label>
      <input type="password" id="senha" required>
      <button type="submit">Entrar</button>
    </form>
    <div class="foot">Metodologia GeFit — Fitness Intelligence</div>
  </div>

<script src="config.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const errBox = document.getElementById('errorMsg');
    errBox.style.display = 'none';

    const { data, error } = await supabaseClient
      .from('usuarios')
      .select('*')
      .eq('email', email)
      .eq('senha', senha)
      .eq('ativo', true)
      .maybeSingle();

    if (error || !data) {
      errBox.textContent = 'E-mail ou senha incorretos.';
      errBox.style.display = 'block';
      return;
    }

    gefitSetUser(data);
    window.location.href = 'hub.html';
  });
</script>
