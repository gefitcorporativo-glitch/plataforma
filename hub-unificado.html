<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeFit · Plataforma</title>
<script src="retencao/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="retencao/theme-gefit.css">
<style>
  :root{ --bg:#060A16; --side:#0B1222; --card:#0F182B; --line:#1D2A45; --tx:#fff; --tm:rgba(255,255,255,.68); --td:rgba(255,255,255,.4); --side-w:260px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx);display:flex}
  /* ---------- menu lateral ---------- */
  aside{width:var(--side-w);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:sticky;top:0;z-index:30;transition:transform .2s}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand img.gf-logo{height:38px}
  .brand small{display:block;margin-top:8px;font-family:'Barlow Condensed';font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--td);text-transform:uppercase}
  nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
  .grp{font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--td);padding:16px 10px 6px}
  .item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:var(--tm);font-family:'Barlow';font-size:14.5px;font-weight:500;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .12s,color .12s}
  .item:hover{background:rgba(255,255,255,.05);color:#fff}
  .item.on{background:rgba(179,244,0,.12);color:var(--gf-lime);font-weight:600}
  .item svg{width:19px;height:19px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--td)}
  /* ---------- área principal ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
  header{height:56px;background:var(--side);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0}
  #burger{display:none;background:none;border:0;color:#fff;cursor:pointer;padding:4px}
  #burger svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
  header h1{font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--tm)}
  .tag{background:rgba(179,244,0,.14);color:var(--gf-lime);font-family:'Barlow Condensed';font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
  .out{background:none;border:1px solid var(--line);color:var(--tm);font-family:'Barlow';font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
  .out:hover{border-color:var(--gf-lime);color:var(--gf-lime)}
  .stage{flex:1;position:relative;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
  iframe.show{display:block}
  /* ---------- início ---------- */
  #home{position:absolute;inset:0;overflow:auto;padding:36px 32px 60px}
  #home h2{font-family:'Barlow Condensed';font-weight:800;font-size:34px;line-height:1.1}
  #home .sub{color:var(--tm);margin:6px 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1100px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;text-align:left;color:#fff;font-family:'Barlow';transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--gf-lime);transform:translateY(-2px)}
  .card .ic{width:40px;height:40px;border-radius:10px;background:rgba(179,244,0,.12);color:var(--gf-lime);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .card .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-family:'Barlow Condensed';font-size:20px;font-weight:700;margin-bottom:4px}
  .card p{font-size:13px;color:var(--tm);line-height:1.45}
  .gname{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--td);margin:26px 0 12px;max-width:1100px}
  /* ---------- celular ---------- */
  @media (max-width:860px){
    aside{position:fixed;left:0;top:0;transform:translateX(-100%)}
    body.open aside{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
    #burger{display:block}
    .who span.nm{display:none}
    #home{padding:24px 16px 50px}
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <img class="gf-logo" src="retencao/logo-gefit.png" alt="GeFit">
    <small id="acadNome">Plataforma</small>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">GeFit · Fitness Intelligence</div>
</aside>

<div class="main">
  <header>
    <button id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <h1 id="titulo">Início</h1>
    <div class="who"><span class="nm" id="uNome">—</span><span class="tag" id="uRole">—</span><button class="out" id="sair">Sair</button></div>
  </header>
  <div class="stage">
    <div id="home"></div>
    <iframe id="frame" title="Módulo"></iframe>
  </div>
</div>

<script>
/* =====================================================================
   HUB GEFIT — casca única (menu lateral + topo) que abre cada módulo.
   Para o cliente: edite só config.js. Para um módulo novo: 1 linha em MODULOS.
   ===================================================================== */
const ICON = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  planner:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h4"/>',
  diario:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  revisao:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>',
  gestao:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  carteira:'<path d="M20 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>',
  vendas:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  mapa:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-4 0 2-6z"/>',
  roi:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  campanhas:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>',
  exper:'<path d="M12 2l3 7h7l-5.5 4.2L18.5 21 12 16.8 5.5 21l2-7.8L2 9h7z"/>',
  scripts:'<path d="M4 4h16v14H7l-3 3z"/>',
  registro:'<path d="M9 5H5a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-4"/><path d="M17 3l4 4-9 9H8v-4z"/>'
};
/* roles: quem enxerga. todos = qualquer perfil logado */
const MODULOS = [
  {grupo:'Retenção', itens:[
    {id:'planner',  nome:'Planner do Treinador', icon:'planner',  url:'retencao/sistema_integrado_v3.html', roles:['treinador'], desc:'Home, agenda, carteira e consultoria técnica.'},
    {id:'diario',   nome:'Diário do Treinador',  icon:'diario',   url:'retencao/diario_treinador.html',     roles:['treinador'], desc:'Relatório diário de atividades e resultados.'},
    {id:'revisao',  nome:'Revisão de Treino',    icon:'revisao',  url:'retencao/revisao_treino.html',       roles:['treinador'], desc:'Checklist guiado da revisão de treino.'},
    {id:'gestao',   nome:'Gestão da Retenção',   icon:'gestao',   url:'retencao/dashboard_gestor_v3.html',  roles:['gestor'],    desc:'Indicadores, equipe, renovações e carteiras.'},
    {id:'carteira', nome:'Atualizar Carteira',   icon:'carteira', url:'retencao/importar_carteira.html',    roles:['gestor'],    desc:'Suba a planilha de alunos e distribua a carteira.'},
    {id:'vendas',   nome:'Painel de Vendas',     icon:'vendas',   url:'retencao/painel_vendas.html',        roles:['consultor','gestor'], desc:'Funil de experiências e follow-ups.'},
    {id:'mapa',     nome:'Mapa do Sistema',      icon:'mapa',     url:'retencao/mapa_retencao.html',        roles:['todos'],     desc:'Como cada tela funciona, passo a passo.'}
  ]},
  {grupo:'Comercial · Desafio ROI 21', itens:[
    {id:'roi',      nome:'Desafio ROI 21 Dias',  icon:'roi',      url:'index.html',              roles:['gestor','consultor'], desc:'Painel geral, vendas, marketing e planejamento.'},
    {id:'registro', nome:'Registro Diário',      icon:'registro', url:'registro-diario.html',    roles:['gestor','consultor'], desc:'Lançamento diário de vendas.'},
    {id:'camp',     nome:'Campanhas',            icon:'campanhas',url:'campanhas.html',          roles:['gestor','consultor'], desc:'CRM em kanban: leads, carteira e distribuição.'},
    {id:'exper',    nome:'Controle de Experiências', icon:'exper',url:'controle-experiencias.html', roles:['gestor','consultor','treinador'], desc:'Do agendamento da experiência à conversão.'},
    {id:'scripts',  nome:'Central de Scripts AQÚI', icon:'scripts', url:'central-scripts-aqui.html', roles:['todos'], desc:'Biblioteca de metodologia e scripts.'}
  ]}
];

const user = (()=>{ try{return JSON.parse(localStorage.getItem('qg90_user')||'null')}catch(e){return null} })();
if(!user || !user.role){ location.replace('retencao/index.html'); }

const ROLE_LABEL = {treinador:'Treinador(a)', gestor:'Gestão', consultor:'Consultor(a)'};
const $ = id => document.getElementById(id);
const svg = k => `<svg viewBox="0 0 24 24">${ICON[k]||ICON.home}</svg>`;
const visivel = m => m.roles.includes('todos') || m.roles.includes(user.role);

$('uNome').textContent = user.nome || '';
$('uRole').textContent = ROLE_LABEL[user.role] || user.role;
$('acadNome').textContent = (window.APP_CONFIG && APP_CONFIG.NOME_MARCA) || 'Plataforma';

const grupos = MODULOS.map(g=>({grupo:g.grupo, itens:g.itens.filter(visivel)})).filter(g=>g.itens.length);
const todos = grupos.flatMap(g=>g.itens);

function montarMenu(){
  let h = `<button class="item" data-id="home">${svg('home')}<span>Início</span></button>`;
  grupos.forEach(g=>{ h += `<div class="grp">${g.grupo}</div>` + g.itens.map(m=>`<button class="item" data-id="${m.id}">${svg(m.icon)}<span>${m.nome}</span></button>`).join(''); });
  $('nav').innerHTML = h;
  $('nav').querySelectorAll('.item').forEach(b=>b.onclick=()=>abrir(b.dataset.id));
}
function montarHome(){
  const primeiro = (user.nome||'').split(' ')[0];
  let h = `<h2>Olá${primeiro?', '+primeiro:''}</h2><div class="sub">Escolha um módulo para continuar.</div>`;
  grupos.forEach(g=>{ h += `<div class="gname">${g.grupo}</div><div class="grid">` + g.itens.map(m=>`<button class="card" data-id="${m.id}"><div class="ic">${svg(m.icon)}</div><h3>${m.nome}</h3><p>${m.desc}</p></button>`).join('') + `</div>`; });
  $('home').innerHTML = h;
  $('home').querySelectorAll('.card').forEach(b=>b.onclick=()=>abrir(b.dataset.id));
}
function abrir(id, pushHash=true){
  const m = todos.find(x=>x.id===id);
  document.body.classList.remove('open');
  document.querySelectorAll('.item').forEach(b=>b.classList.toggle('on', b.dataset.id===(m?id:'home')));
  if(!m){ $('home').style.display='block'; $('frame').classList.remove('show'); $('frame').removeAttribute('src'); $('titulo').textContent='Início'; if(pushHash) location.hash=''; return; }
  $('home').style.display='none';
  $('titulo').textContent = m.nome;
  const f = $('frame'); f.classList.add('show');
  if(f.dataset.id!==id){ f.src = m.url; f.dataset.id = id; }
  if(pushHash) location.hash = id;
}
/* se o módulo mandar de volta ao login (sessão caiu), sai da casca */
$('frame').addEventListener('load', ()=>{
  try{ const p = $('frame').contentWindow.location.pathname; if(/\/retencao\/index\.html$/.test(p)) location.replace('retencao/index.html'); }catch(e){}
});
$('burger').onclick = ()=>document.body.classList.toggle('open');
$('sair').onclick = async ()=>{
  try{ if(window.supabase && window.APP_CONFIG){ await window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON).auth.signOut(); } }catch(e){}
  ['qg90_user','qg90_treinador','gefit_user'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  try{sessionStorage.removeItem('qg90_admin')}catch(e){}
  location.replace('retencao/index.html');
};

if(user && user.role){
  montarMenu(); montarHome();
  const h = (location.hash||'').replace('#','');
  abrir(todos.some(m=>m.id===h) ? h : (user.role==='treinador'?'planner':user.role==='gestor'?'gestao':user.role==='consultor'?'vendas':'home'), false);
}
</script>
</body>
</html>
