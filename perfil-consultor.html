<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Perfil do(a) Consultor(a), GeFit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --or:#B3F400; --bg:#060A16; --s1:#0B1222; --s2:#101A2E; --s3:#16223A;
    --bd:rgba(255,255,255,0.07); --tx:#fff; --tm:rgba(255,255,255,0.68); --td:rgba(255,255,255,0.38);
    --gr:#22c55e; --re:#ef4444; --am:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx)}
  h1,h2,h3{font-family:'Barlow Condensed'}
  header{background:var(--s1);padding:16px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--bd)}
  header a{color:var(--tm);text-decoration:none;font-size:13px}
  .logo{font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:var(--or)}
  main{max-width:820px;margin:0 auto;padding:30px 20px 60px}
  .card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:22px;margin-bottom:18px}
  .card h3{font-size:16px;font-weight:600;margin-bottom:14px}
  .sub{font-size:12px;color:var(--td);margin-top:-8px;margin-bottom:16px}
  .fg{margin-bottom:14px}
  .fl{font-size:11.5px;font-weight:600;color:var(--tm);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .fi{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:7px;background:var(--s2);color:var(--tx);font-family:'Barlow';font-size:13.5px}
  .row{display:grid;gap:12px}
  .row3{grid-template-columns:1fr 1fr 1fr}
  .row2{grid-template-columns:1fr 1fr}
  .btn{background:var(--or);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-family:'Barlow Condensed';font-weight:700;font-size:13px;cursor:pointer}
  .btn-gh{background:transparent;border:1px solid var(--bd);color:var(--tm);border-radius:7px;padding:8px 14px;font-family:'Barlow';font-size:12.5px;cursor:pointer}
  .item{padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
  .item:last-child{border-bottom:none}
  .item .meta{font-size:11px;color:var(--td);margin-top:3px}
  .badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;text-transform:uppercase}
  .badge.pendente{background:rgba(245,158,11,.15);color:var(--am)}
  .badge.em_andamento{background:rgba(179,244,0,.15);color:var(--or)}
  .badge.concluido{background:rgba(34,197,94,.15);color:var(--gr)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--td);font-size:10.5px;text-transform:uppercase;padding:0 8px 8px;border-bottom:1px solid var(--bd)}
  td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
  .locked{text-align:center;color:var(--td);padding:60px 20px}
</style>
<script src="gf-embed.js"></script>
<link rel="stylesheet" href="theme-gefit.css">
<style>
  /* Perfil comportamental */
  .pf-badges{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
  .pf-badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--bd);background:var(--s2)}
  .bars{display:grid;gap:8px;margin-bottom:16px}
  .bar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:13px}
  .bar .t{height:9px;background:var(--s3);border-radius:9px;overflow:hidden}
  .bar .t i{display:block;height:100%;background:var(--pc);border-radius:9px}
  .bar b{text-align:right}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .two ul{padding-left:18px;font-size:13px;color:var(--tm);line-height:1.6}
  .two h4,.pf-lid h4{font-family:'Barlow Condensed';font-size:14px;margin-bottom:6px}
  .pf-lid{background:rgba(179,244,0,.07);border:1px solid rgba(179,244,0,.25);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:13px;color:var(--tm)}
  .lib{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);font-size:13px;flex-wrap:wrap}
  .sw{position:relative;width:40px;height:22px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw i{position:absolute;inset:0;background:var(--s3);border-radius:22px;cursor:pointer;transition:.2s}
  .sw i:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+i{background:var(--or)}
  .sw input:checked+i:before{transform:translateX(18px)}
  .linkbox{font-family:monospace;font-size:11.5px;background:var(--s2);border:1px dashed var(--bd);border-radius:8px;padding:8px 10px;word-break:break-all;color:var(--tm);margin:10px 0}
  .small{font-size:11.5px;color:var(--td);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
  <header>
    <a href="index.html">← Voltar</a>
    <div class="logo">GeFit</div>
    <div style="font-size:13px;color:var(--tm)">Perfil do(a) Consultor(a)</div>
  </header>

  <main id="app">
    <div class="locked">Carregando...</div>
  </main>

<script>
  const SB_URL='https://irwvagffrguiljaxrzmd.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyd3ZhZ2Zmcmd1aWxqYXhyem1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNDk5ODUsImV4cCI6MjEwNDkyNTk4NX0.YAApyaH6iIHEua_89fgCUpMzgXRIcWb_vNRkBQAoq5A';
  const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
  async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:{...H,'Prefer':''}});if(!r.ok)throw new Error(await r.text());return r.json()}
  async function sbPost(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json()}
  async function sbUpsert(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json()}

  const params=new URLSearchParams(location.search);
  const uid=params.get('uid'), consultoraId=params.get('id');
  let viewer=null, consultora=null, canEdit=false, canView=false;

  function uidGen(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  function fmtR$(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function fmtData(d){return d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'-';}
  function trimestreAtual(){const m=new Date().getMonth();const t=Math.floor(m/3)+1;return `${new Date().getFullYear()}-Q${t}`;}

  async function init(){
    const app=document.getElementById('app');
    if(!uid||!consultoraId){app.innerHTML='<div class="locked">Link inválido, acesse pela aba Equipe do sistema.</div>';return;}
    try{
      const [viewers,conss]=await Promise.all([
        sbGet('gestores',`id=eq.${uid}`),
        sbGet('consultoras',`id=eq.${consultoraId}`)
      ]);
      viewer=viewers[0]; consultora=conss[0];
    }catch(e){console.error(e);}
    if(!viewer||!consultora){app.innerHTML='<div class="locked">Não foi possível carregar. Volte e tente de novo.</div>';return;}
    canEdit=viewer.role==='gestor'||viewer.role==='admin';
    canView=canEdit||(viewer.role==='consultor'&&viewer.consultora_id===consultoraId);
    if(!canView){app.innerHTML='<div class="locked">🔒 Você não tem acesso a este perfil.</div>';return;}
    render();
  }

  function render(){
    const app=document.getElementById('app');
    const tipoLbl={planos:'Nº Planos',rs:'R$ Valor',treino:'Treinamento'};
    app.innerHTML=`
      <div class="card">
        <h2 style="font-size:22px">${consultora.nome}</h2>
        <div class="sub">Consultor(a) de Vendas · desde ${fmtData((consultora.criado_em||'').slice(0,10))} · meta atual: ${tipoLbl[consultora.meta_tipo]||'-'} ${consultora.meta_tipo==='rs'?fmtR$(consultora.meta):consultora.meta||''}</div>
      </div>

      <div class="card">
        <h3>🎯 Metas por período</h3>
        <div class="sub">Histórico de metas definidas para cada mês ou campanha.</div>
        <div id="metas-lista"></div>
        ${canEdit?`
        <div class="row row3" style="margin-top:16px">
          <div class="fg"><label class="fl">Início do período</label><input class="fi" type="date" id="mp-inicio"></div>
          <div class="fg"><label class="fl">Fim (opcional)</label><input class="fi" type="date" id="mp-fim"></div>
          <div class="fg"><label class="fl">Tipo</label>
            <select class="fi" id="mp-tipo"><option value="planos">Nº Planos</option><option value="rs">R$ Valor</option><option value="treino">Treinamento</option></select>
          </div>
        </div>
        <div class="fg"><label class="fl">Valor da meta</label><input class="fi" type="number" id="mp-valor"></div>
        <button class="btn" onclick="addMetaPeriodo()">Adicionar período</button>`:''}
      </div>

      <div class="card">
        <h3>📊 KPIs mensais</h3>
        <div class="sub">Matrículas e valor vendido puxados automático dos lançamentos diários.</div>
        <table><thead><tr><th>Mês</th><th>Matrículas</th><th>Vendido</th><th>Observação</th></tr></thead><tbody id="kpis-tbody"></tbody></table>
      </div>

      <div class="card">
        <h3>🗣️ Registros de 1:1</h3>
        <div id="a1a-lista"></div>
        ${canEdit?`
        <div class="row row2" style="margin-top:14px">
          <div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="a1a-data"></div>
        </div>
        <div class="fg"><label class="fl">Anotação</label><input class="fi" id="a1a-desc" placeholder="O que foi conversado..."></div>
        <button class="btn" onclick="add1a1()">Adicionar registro</button>`:''}
      </div>

      <div class="card" id="card-perfil">
        <h3>🧠 Perfil comportamental</h3>
        <div id="perfil-corpo"><div class="item" style="color:var(--td)">Carregando...</div></div>
      </div>

      <div class="card">
        <h3>📋 Planos de ação trimestrais</h3>
        <div id="plano-lista"></div>
        ${canEdit?`
        <div class="row row3" style="margin-top:14px">
          <div class="fg"><label class="fl">Trimestre</label><input class="fi" id="pa-trimestre" value="${trimestreAtual()}"></div>
          <div class="fg"><label class="fl">Status</label>
            <select class="fi" id="pa-status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="concluido">Concluído</option></select>
          </div>
        </div>
        <div class="fg"><label class="fl">Descrição</label><input class="fi" id="pa-desc" placeholder="Demanda ou plano de melhoria..."></div>
        <button class="btn" onclick="addPlanoAcao()">Adicionar plano de ação</button>`:''}
      </div>
    `;
    carregarMetas(); carregarKpis(); carregarRegistros('1a1','a1a-lista'); carregarRegistros('plano_acao','plano-lista'); carregarPerfil();
  }

  async function carregarMetas(){
    const rows=await sbGet('consultora_metas_periodo',`consultora_id=eq.${consultoraId}&order=periodo_inicio.desc`);
    const tipoLbl={planos:'Nº Planos',rs:'R$ Valor',treino:'Treinamento'};
    const el=document.getElementById('metas-lista');
    if(!rows.length){el.innerHTML='<div class="item" style="color:var(--td)">Nenhum período registrado ainda.</div>';return;}
    el.innerHTML=rows.map(r=>`<div class="item">${fmtData(r.periodo_inicio)} ${r.periodo_fim?'-'+fmtData(r.periodo_fim):'(em aberto)'}
      <div class="meta">${tipoLbl[r.meta_tipo]||'-'}: ${r.meta_tipo==='rs'?fmtR$(r.meta_valor):r.meta_valor}</div></div>`).join('');
  }
  async function addMetaPeriodo(){
    const inicio=document.getElementById('mp-inicio').value;
    if(!inicio)return alert('Informe o início do período.');
    await sbPost('consultora_metas_periodo',{
      academia_id:consultora.academia_id, consultora_id:consultoraId,
      periodo_inicio:inicio, periodo_fim:document.getElementById('mp-fim').value||null,
      meta_tipo:document.getElementById('mp-tipo').value, meta_valor:parseFloat(document.getElementById('mp-valor').value)||null,
      criado_em:Date.now()
    });
    carregarMetas();
  }

  async function carregarKpis(){
    const regs=await sbGet('registros',`consultora_id=eq.${consultoraId}&order=data.desc`);
    const kpisSalvos=await sbGet('consultor_kpis_mensais',`consultora_id=eq.${consultoraId}`);
    const obsMap={}; kpisSalvos.forEach(k=>obsMap[k.mes_referencia.slice(0,7)]=k.observacao||'');
    const porMes={};
    regs.forEach(r=>{
      const m=r.data.slice(0,7);
      if(!porMes[m])porMes[m]={matriculas:0,vendido:0};
      if(r.funis){
        Object.values(r.funis).forEach(fd=>{porMes[m].matriculas+=(fd.convertidos||0);porMes[m].vendido+=(fd.vendido||0);});
      }
    });
    const meses=Object.keys(porMes).sort().reverse().slice(0,6);
    const tbody=document.getElementById('kpis-tbody');
    if(!meses.length){tbody.innerHTML='<tr><td colspan="4" style="color:var(--td)">Sem lançamentos ainda.</td></tr>';return;}
    tbody.innerHTML=meses.map(m=>{
      const d=porMes[m];
      const editable=canEdit?`<input class="fi" style="font-size:12px;padding:5px 7px" value="${(obsMap[m]||'').replace(/"/g,'&quot;')}" onchange="salvarObsKpi('${m}',this.value)">`:(obsMap[m]||'-');
      return `<tr><td>${m}</td><td>${d.matriculas}</td><td>${fmtR$(d.vendido)}</td><td>${editable}</td></tr>`;
    }).join('');
  }
  async function salvarObsKpi(mes,valor){
    await sbUpsert('consultor_kpis_mensais',{academia_id:consultora.academia_id,consultora_id:consultoraId,mes_referencia:mes+'-01',observacao:valor,updated_at:Date.now()});
  }

  async function carregarRegistros(tipo,elId){
    const rows=await sbGet('consultor_registros',`consultora_id=eq.${consultoraId}&tipo=eq.${tipo}&order=data.desc`);
    const el=document.getElementById(elId);
    if(!rows.length){el.innerHTML='<div class="item" style="color:var(--td)">Nenhum registro ainda.</div>';return;}
    el.innerHTML=rows.map(r=>`<div class="item">
      ${tipo==='plano_acao'?`<b>${r.trimestre}</b> <span class="badge ${r.status}">${({pendente:'Pendente',em_andamento:'Em andamento',concluido:'Concluído'})[r.status]||r.status}</span>`:fmtData(r.data)}
      <div class="meta">${r.descricao||''}</div>
    </div>`).join('');
  }
  async function add1a1(){
    const data=document.getElementById('a1a-data').value;
    const desc=document.getElementById('a1a-desc').value.trim();
    if(!data||!desc)return alert('Preencha data e anotação.');
    await sbPost('consultor_registros',{academia_id:consultora.academia_id,consultora_id:consultoraId,tipo:'1a1',data,descricao:desc,criado_por:uid,criado_em:Date.now()});
    document.getElementById('a1a-desc').value='';
    carregarRegistros('1a1','a1a-lista');
  }
  async function addPlanoAcao(){
    const desc=document.getElementById('pa-desc').value.trim();
    if(!desc)return alert('Descreva o plano de ação.');
    await sbPost('consultor_registros',{
      academia_id:consultora.academia_id,consultora_id:consultoraId,tipo:'plano_acao',
      data:new Date().toISOString().slice(0,10),trimestre:document.getElementById('pa-trimestre').value,
      descricao:desc,status:document.getElementById('pa-status').value,criado_por:uid,criado_em:Date.now()
    });
    document.getElementById('pa-desc').value='';
    carregarRegistros('plano_acao','plano-lista');
  }

  function esc(t){return String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
  async function sbPatch(t,id,b){const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json().catch(()=>[])}
  /* ======================= PERFIL COMPORTAMENTAL ======================= */
  const PERF={
    D:{nome:'Executor',cor:'#FF7A63',fortes:['Decisão rápida e iniciativa','Foco em meta e resiliência','Assume a frente em situações difíceis'],desafios:['Impaciência e pouca escuta','Tom duro sob pressão','Dificuldade de delegar'],lider:'Meta clara, autonomia e cobrança de resultado com respeito.',tec:'Fecha rápido e gosta de meta. Cuidado para respeitar o tempo de decisão do lead.'},
    I:{nome:'Comunicador',cor:'#F5BD3C',fortes:['Persuasão e carisma','Cria vínculo rápido com alunos','Mobiliza e anima o time'],desafios:['Dispersão em rotina e detalhe','Follow-up e registros','Otimismo que subestima riscos'],lider:'Reconhecimento, espaço para interagir e prazos curtos combinados.',tec:'Cria vínculo e encanta na conversa. Precisa de disciplina no registro e no follow-up.'},
    S:{nome:'Planejador',cor:'#58C98A',fortes:['Constância e confiabilidade','Paciência e escuta','Ótimo em retenção e acompanhamento'],desafios:['Resistência a mudanças rápidas','Demora em decisões difíceis','Evita dizer não'],lider:'Previsibilidade, mudanças explicadas com antecedência e elogio sincero.',tec:'Constante e confiável no acompanhamento. Precisa de estímulo para propor o fechamento.'},
    C:{nome:'Analista',cor:'#7DA6FF',fortes:['Atenção a detalhe e qualidade','Organização e consistência','Análise antes de agir'],desafios:['Perfeccionismo e lentidão','Aversão a risco','Frieza percebida no primeiro contato'],lider:'Critério claro, tempo para se preparar e feedback objetivo.',tec:'Preparada e precisa nas informações. Precisa de calor humano no primeiro contato.'}
  };
  let TESTE=null;
  function linkTeste(){
    const base=location.href.split('?')[0].replace(/[^/]*$/,'');
    return `${base}teste-candidato.html?a=${encodeURIComponent(consultora.academia_id)}&col=consultor&pid=${encodeURIComponent(consultoraId)}&n=${encodeURIComponent(consultora.nome||'')}`;
  }
  function msgTeste(){const p=(consultora.nome||'').split(' ')[0];return `Oi, ${p}! Separei um teste rápido de perfil comportamental para a gente usar nas nossas conversas de desenvolvimento. São 12 situações do dia a dia, leva uns 5 minutos e não tem resposta certa ou errada:\n${linkTeste()}`}
  async function carregarPerfil(){
    const el=document.getElementById('perfil-corpo');
    try{const r=await sbGet('pessoas_testes',`pessoa_tipo=eq.consultor&pessoa_id=eq.${encodeURIComponent(consultoraId)}&select=*&order=created_at.desc&limit=1`);TESTE=r[0]||null}
    catch(e){el.innerHTML='<div class="leg" style="color:var(--am)">⚠️ Falta rodar o SQL schema-perfil-colaborador.sql no Supabase para ligar o teste ao colaborador.</div>';return}
    renderPerfil();
  }
  function blocoEnvio(titulo){
    return`<div class="sub" style="margin:0 0 6px">${titulo}</div>
      <div class="linkbox" id="pf-link">${esc(linkTeste())}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msgTeste())}">📲 Enviar pelo WhatsApp</a>
        <button class="btn-gh" onclick="copiarLinkTeste(this)">Copiar link</button>
        <button class="btn-gh" onclick="carregarPerfil()">↻ Ver se já respondeu</button>
      </div>`;
  }
  function copiarLinkTeste(b){navigator.clipboard.writeText(linkTeste()).then(()=>{b.textContent='Link copiado ✓';setTimeout(()=>b.textContent='Copiar link',1800)}).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('pf-link'));const s=getSelection();s.removeAllRanges();s.addRange(r)})}
  function renderPerfil(){
    const el=document.getElementById('perfil-corpo');
    if(!TESTE){
      el.innerHTML=canEdit?blocoEnvio('Ainda não respondeu. Envie o teste (12 situações, 5 minutos). O resultado aparece aqui, só para a gestão, até você liberar.')
        :'<div class="item" style="color:var(--td)">Nenhum teste de perfil respondido ainda.</div>';
      return;
    }
    const sc=TESTE.sc||{},t=Object.values(sc).reduce((a,b)=>a+b,0)||1;
    const ord=['D','I','S','C'].sort((a,b)=>(sc[b]||0)-(sc[a]||0)),p=ord[0],s=ord[1];
    const P=PERF[p];
    const dt=(TESTE.created_at||'').slice(0,10);
    if(!canEdit&&!TESTE.liberado){el.innerHTML='<div class="item" style="color:var(--td)">Você já respondeu o teste. O resultado será apresentado pelo seu gestor numa conversa de devolutiva.</div>';return}
    el.innerHTML=`
      <div class="sub" style="margin:0">Respondido em ${fmtData(dt)}${canEdit?` · consistência das respostas: ${Math.round(Number(TESTE.cons||0)*100)}%`:''}</div>
      <div class="pf-badges">
        <span class="pf-badge" style="border-color:${P.cor};color:${P.cor}">Predominante: ${P.nome} ${Math.round((sc[p]||0)/t*100)}%</span>
        <span class="pf-badge">Secundário: ${PERF[s].nome} ${Math.round((sc[s]||0)/t*100)}%</span>
      </div>
      <div class="bars">${['D','I','S','C'].map(k=>`<div class="bar" style="--pc:${PERF[k].cor}"><span>${PERF[k].nome}</span><span class="t"><i style="width:${(sc[k]||0)/t*100}%"></i></span><b>${Math.round((sc[k]||0)/t*100)}%</b></div>`).join('')}</div>
      <div class="two">
        <div><h4>Pontos fortes</h4><ul>${P.fortes.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><h4>${canEdit?'Pede acompanhamento':'Pontos de desenvolvimento'}</h4><ul>${P.desafios.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
      ${canEdit?`<div class="pf-lid"><h4>Como liderar</h4>${P.lider}<br><span style="color:var(--td)">No atendimento comercial:</span> ${P.tec}</div>
      <div class="lib">
        <label class="sw"><input type="checkbox" ${TESTE.liberado?'checked':''} onchange="liberarPerfil(this.checked)"><i></i></label>
        <span><b>${TESTE.liberado?'Liberado para o colaborador':'Só a gestão vê'}</b><br><span style="color:var(--td);font-size:12px">${TESTE.liberado?'Ele(a) vê o resultado no próprio perfil.':'Libere depois da conversa de devolutiva.'}</span></span>
        <button class="btn-gh btn-sm" style="margin-left:auto" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Enviar novo teste</button>
        <div hidden style="flex-basis:100%">${blocoEnvio('Um novo teste substitui este resultado quando for respondido.')}</div>
      </div>`:''}
      <p class="small">O perfil indica tendência de comportamento. É apoio para a conversa, não um rótulo.</p>`;
  }
  async function liberarPerfil(v){
    try{await sbPatch('pessoas_testes',TESTE.id,{liberado:v});TESTE.liberado=v;renderPerfil()}catch(e){console.error(e);alert('Não foi possível salvar.');renderPerfil()}
  }

  init();
</script>
</body>
</html>
